<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            background: #16213e;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .chat-header {
            padding: 20px 24px;
            background: #0f3460;
            border-bottom: 1px solid #1a4a7a;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .avatar {
            width: 40px;
            height: 40px;
            background: #e94560;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .chat-header p {
            font-size: 12px;
            color: #8899aa;
            margin-top: 2px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            margin-left: auto;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .messages::-webkit-scrollbar {
            width: 4px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #0f3460;
            border-radius: 2px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.bot .message-avatar {
            background: #0f3460;
        }

        .message.user .message-avatar {
            background: #e94560;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
        }

        .message.bot .message-bubble {
            background: #0f3460;
            border-bottom-left-radius: 4px;
            color: #e0e0e0;
        }

        .message.user .message-bubble {
            background: #e94560;
            border-bottom-right-radius: 4px;
            color: #ffffff;
        }

        /* Курсор мигающий во время стриминга */
        .streaming::after {
            content: '▋';
            animation: blink 0.7s infinite;
            color: #e94560;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .input-area {
            padding: 20px 24px;
            background: #0f3460;
            border-top: 1px solid #1a4a7a;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            background: #16213e;
            border: 1px solid #1a4a7a;
            border-radius: 12px;
            padding: 12px 16px;
            color: #e0e0e0;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 120px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #e94560;
        }

        textarea::placeholder {
            color: #556677;
        }

        button {
            width: 44px;
            height: 44px;
            background: #e94560;
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
            flex-shrink: 0;
        }

        button:hover:not(:disabled) {
            background: #c73652;
            transform: scale(1.05);
        }

        button:disabled {
            background: #334455;
            cursor: not-allowed;
        }

        .welcome-message {
            text-align: center;
            color: #556677;
            font-size: 14px;
            margin: auto;
        }

        .welcome-message .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
<div class="chat-container">

    <!-- Шапка -->
    <div class="chat-header">
        <div class="avatar">🏨</div>
        <div>
            <h1>Hotel Assistant</h1>
            <p>Задайте любой вопрос об отеле</p>
        </div>
        <div class="status-dot"></div>
    </div>

    <!-- Сообщения -->
    <div class="messages" id="messages">
        <div class="welcome-message">
            <div class="icon">🏨</div>
            <p>Привет! Я ваш персональный ассистент отеля.<br>Чем могу помочь?</p>
        </div>
    </div>

    <!-- Поле ввода -->
    <div class="input-area">
        <textarea
                id="input"
                placeholder="Напишите ваш вопрос..."
                rows="1"
                onkeydown="handleKeyDown(event)"
                oninput="autoResize(this)"
        ></textarea>
        <button id="sendBtn" onclick="sendMessage()" title="Отправить">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>

<script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const STORAGE_KEY = 'hotel_chat_history';

    function handleKeyDown(e) {
        // Enter без Shift — отправить
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function addMessage(text, type) {
        // Убираем welcome message если есть
        const welcome = messagesEl.querySelector('.welcome-message');
        if (welcome) welcome.remove();

        const avatarIcon = type === 'user' ? '👤' : '🏨';

        const messageEl = document.createElement('div');
        messageEl.className = `message ${type}`;
        messageEl.innerHTML = `
            <div class="message-avatar">${avatarIcon}</div>
            <div class="message-bubble">${text}</div>
        `;
        messagesEl.appendChild(messageEl);
        scrollToBottom();
        return messageEl.querySelector('.message-bubble');
    }

    function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function saveMessage(role, content) {
        const history = getHistory();
        history.push({ role, content });
        // Храним только последние 20 сообщений
        if (history.length > 20) history.shift();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function getHistory() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch {
            return [];
        }
    }

    async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;

        sendBtn.disabled = true;
        inputEl.value = '';
        inputEl.style.height = 'auto';

        addMessage(text, 'user');

        // Сохраняем вопрос пользователя
        saveMessage('user', text);

        const botBubble = addMessage('', 'bot');
        botBubble.classList.add('streaming');

        try {
            // ← передаём историю в запросе
            const response = await fetch('/api/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: text,
                    history: getHistory().slice(0, -1),
                    timestamp: new Date().toISOString()// без последнего (текущий вопрос)
                })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullText = '';
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();

                for (const line of lines) {
                    if (line.startsWith('data:')) {
                        const raw = line.slice(5);
                        try {
                            const json = JSON.parse(raw);
                            fullText += json.token;
                            botBubble.textContent = fullText;
                            scrollToBottom();
                        } catch (e) {}
                    }
                }
            }

            // Сохраняем ответ бота в историю
            if (fullText) {
                saveMessage('assistant', fullText);
            }

        } catch (error) {
            botBubble.textContent = 'Произошла ошибка. Попробуйте снова.';
            console.error('Ошибка:', error);
        } finally {
            botBubble.classList.remove('streaming');
            sendBtn.disabled = false;
            inputEl.focus();
        }
    }
</script>
</body>
</html>
