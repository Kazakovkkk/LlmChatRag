<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 24px;
        }

        .card {
            background: #16213e;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .header .avatar {
            width: 48px;
            height: 48px;
            background: #e94560;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .header p {
            font-size: 12px;
            color: #8899aa;
            margin-top: 2px;
        }

        .upload-area {
            border: 2px dashed #1a4a7a;
            border-radius: 12px;
            padding: 40px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.05);
        }

        .upload-area .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .upload-area p {
            color: #8899aa;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .upload-area .hint {
            font-size: 12px;
            color: #556677;
        }

        #fileInput {
            display: none;
        }

        .file-selected {
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid #e94560;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .file-selected .file-icon { font-size: 20px; }

        .file-selected .file-name {
            flex: 1;
            color: #e0e0e0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-selected .file-size { color: #8899aa; font-size: 12px; }

        .btn {
            width: 100%;
            padding: 14px;
            background: #e94560;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover:not(:disabled) { background: #c73652; }

        .btn:disabled {
            background: #334455;
            cursor: not-allowed;
        }

        .progress {
            display: none;
            margin-top: 20px;
        }

        .progress-bar-bg {
            background: #0f3460;
            border-radius: 8px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 100%;
            background: #e94560;
            border-radius: 8px;
            width: 0%;
            transition: width 0.3s;
            animation: indeterminate 1.5s infinite;
        }

        @keyframes indeterminate {
            0% { width: 0%; margin-left: 0%; }
            50% { width: 60%; margin-left: 20%; }
            100% { width: 0%; margin-left: 100%; }
        }

        .progress p {
            font-size: 13px;
            color: #8899aa;
            text-align: center;
        }

        .result {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
        }

        .result.success {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid #4caf50;
            color: #4caf50;
        }

        .result.error {
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid #e94560;
            color: #e94560;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #8899aa;
            text-decoration: none;
            font-size: 13px;
            margin-top: 20px;
            transition: color 0.2s;
        }

        .nav-link:hover { color: #e94560; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <div class="avatar">⚙️</div>
            <div>
                <h1>Панель администратора</h1>
                <p>Загрузка документов в базу знаний</p>
            </div>
        </div>

        <!-- Зона загрузки -->
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <div class="icon">📄</div>
            <p>Нажмите или перетащите PDF файл сюда</p>
            <div class="hint">Поддерживается только формат PDF</div>
        </div>

        <input type="file" id="fileInput" accept=".pdf" onchange="onFileSelected(this)">

        <!-- Выбранный файл -->
        <div class="file-selected" id="fileSelected">
            <span class="file-icon">📄</span>
            <span class="file-name" id="fileName"></span>
            <span class="file-size" id="fileSize"></span>
        </div>

        <!-- Кнопка загрузки -->
        <button class="btn" id="uploadBtn" onclick="uploadFile()" disabled>
            Загрузить в базу знаний
        </button>

        <!-- Прогресс -->
        <div class="progress" id="progress">
            <div class="progress-bar-bg">
                <div class="progress-bar"></div>
            </div>
            <p>Обрабатываем документ...</p>
        </div>

        <!-- Результат -->
        <div class="result" id="result"></div>

        <a href="/" class="nav-link">← Вернуться в чат</a>
    </div>
</div>

<script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const fileSelected = document.getElementById('fileSelected');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const progress = document.getElementById('progress');
    const result = document.getElementById('result');

    // Drag & Drop
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file && file.type === 'application/pdf') {
            fileInput.files = e.dataTransfer.files;
            showSelectedFile(file);
        } else {
            showResult('error', 'Пожалуйста загрузите файл в формате PDF');
        }
    });

    function onFileSelected(input) {
        if (input.files && input.files[0]) {
            showSelectedFile(input.files[0]);
        }
    }

    function showSelectedFile(file) {
        fileName.textContent = file.name;
        fileSize.textContent = formatSize(file.size);
        fileSelected.style.display = 'flex';
        uploadBtn.disabled = false;
        result.style.display = 'none';
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    async function uploadFile() {
        const file = fileInput.files[0];
        if (!file) return;

        uploadBtn.disabled = true;
        progress.style.display = 'block';
        result.style.display = 'none';

        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch('/api/documents/upload-pdf', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                showResult('success',
                    `✅ Документ "${data.file}" успешно загружен в базу знаний!`);
                // Сбрасываем форму
                fileInput.value = '';
                fileSelected.style.display = 'none';
                uploadBtn.disabled = true;
            } else {
                showResult('error', `❌ Ошибка: ${data.message}`);
                uploadBtn.disabled = false;
            }

        } catch (error) {
            showResult('error', '❌ Ошибка соединения с сервером');
            uploadBtn.disabled = false;
            console.error(error);
        } finally {
            progress.style.display = 'none';
        }
    }

    function showResult(type, message) {
        result.className = `result ${type}`;
        result.textContent = message;
        result.style.display = 'block';
    }
</script>
</body>
</html>
