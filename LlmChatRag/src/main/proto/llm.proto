syntax = "proto3";

package llm;

option java_package = "com.example.grpc.llm";
option java_multiple_files = true;

service LlmService {
  rpc AnswerStream(AnswerStreamRequest)
      returns (stream AnswerStreamResponse);

  rpc PreprocessQuestion(PreprocessGrpcRequest)
      returns (PreprocessGrpcResponse);
}

message MessageProto {
  string role = 1;
  string content = 2;
}

message AnswerStreamRequest {
  string question = 1;
  string context = 2;
  repeated MessageProto history = 3;
  string timestamp = 4;
}

message AnswerStreamResponse {
  string token = 1;
}

message PreprocessGrpcRequest {
  string question = 1;
  repeated MessageProto history = 2;
}

message PreprocessGrpcResponse {
  string intent_type = 1;
  string action_name = 2;
  map<string, string> parameters = 3;
  string normalized = 4;
  repeated string alternatives = 5;
}