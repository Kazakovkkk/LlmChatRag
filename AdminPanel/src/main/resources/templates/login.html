<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SaaS RAG - Вход в панель</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .login-card { background: #16213e; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid #1a4a7a; }
        h2 { text-align: center; margin-bottom: 30px; color: #fff; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #8899aa; }
        input { width: 100%; padding: 12px; background: #1a1a2e; border: 1px solid #1a4a7a; border-radius: 8px; color: #fff; outline: none; box-sizing: border-box; }
        input:focus { border-color: #e94560; }
        .btn { width: 100%; padding: 14px; background: #e94560; border: none; color: white; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn:hover { background: #c73652; }
        .error-msg { background: rgba(233, 69, 96, 0.1); border: 1px solid #e94560; color: #e94560; padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="login-card">
    <h2>SaaS Admin Login</h2>

    <div class="error-msg" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Email администратора</label>
            <input type="email" name="username" placeholder="admin@hotel.ru" required>
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Войти в панель управления</button>
    </form>
</div>
</body>
</html>
