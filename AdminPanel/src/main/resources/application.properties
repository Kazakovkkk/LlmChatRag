# ===================================================================
# ??????? ????????? ??????????
# ===================================================================
spring.application.name=AdminPanel
# ????????? ???? ??? ???????????????? ??????? (Hotel Service ???????? ?? 8080)
server.port=8087

# ===================================================================
# ????????? ?????????? (??? ???????? ??????? PDF-??????????? ??????)
# ===================================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===================================================================
# ????????? ???? POSTGRESQL (???????? ??????, ????????? ? ????? ????????)
# ===================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hotel_admin_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ????????? JPA / Hibernate
# update ? ????????????? ??????? ??????? chats ? messages ??? ?????? ??????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ????????? ??????????? SQL-???????? ? ??????? (??????? ??? ??????? ? ???)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# ????????? gRPC ??????? (????? ? ????????????? qdrantservice)
# ===================================================================
# ????????? gRPC-?????? 'rag-service', ??????? ?????????? ? RagGrpcClient
# ???? 9090 ????????????? gRPC-??????? QdrantService
spring.grpc.client.channels.rag-service.address=static://localhost:9090
spring.grpc.client.channels.rag-service.negotiation-type=plaintext

# ===================================================================
# ????????? THYMELEAF (????????? ????????? ???????)
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ===================================================================
# ???????????
# ===================================================================
logging.level.root=INFO
logging.level.adminpanel=DEBUG