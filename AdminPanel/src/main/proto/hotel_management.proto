syntax = "proto3";

package management;

option java_package = "com.example.grpc.management";
option java_multiple_files = true;


service HotelManagementService {
  rpc GetGuests (GetGuestsRequest) returns (GetGuestsResponse);
  rpc UpdateGuest (UpdateGuestRequest) returns (ManagementActionResponse);
  rpc GetStaff (GetStaffRequest) returns (GetStaffResponse);
  rpc UpdateStaff (UpdateStaffRequest) returns (ManagementActionResponse);
  rpc GetMenu (GetMenuRequest) returns (GetMenuResponse);
  rpc UpdateMenuStock (UpdateMenuStockRequest) returns (ManagementActionResponse);
  rpc GetTickets (GetTicketsRequest) returns (GetTicketsResponse);
  rpc UpdateTicketStatus (UpdateTicketStatusRequest) returns (ManagementActionResponse);
  rpc DeleteStaff (DeleteStaffRequest) returns (ManagementActionResponse);
  rpc CreateMenu (CreateMenuRequest) returns (ManagementActionResponse);
  rpc DeleteMenu (DeleteMenuRequest) returns (ManagementActionResponse);
  rpc CreateTicket (CreateTicketRequest) returns (ManagementActionResponse);
  rpc DeleteTicket (DeleteTicketRequest) returns (ManagementActionResponse);
}

message ManagementActionResponse {
  bool success = 1;
  string message = 2;
}

message GuestManagementProto {
  string id = 1;
  string chat_id = 2;
  string first_name = 3;
  string last_name = 4;
  string room_number = 5;
  string passport_data_encrypted = 6;
  string status = 7;
}

message StaffManagementProto {
  string id = 1;
  string name = 2;
  string role = 3;
  string status = 4;
}

message MenuItemManagementProto {
  string id = 1;
  string name = 2;
  double price = 3;
  int32 stock_quantity = 4;
}

message TicketManagementProto {
  string id = 1;
  string guest_name = 2;
  string room_number = 3;
  string ticket_type = 4;
  string status = 5;
  string assigned_staff_name = 6;
  double total_price = 7;
  string created_at = 8;
}


message GetGuestsRequest { string hotel_key = 1; }
message GetGuestsResponse { repeated GuestManagementProto guests = 1; }
message UpdateGuestRequest { string hotel_key = 1; GuestManagementProto guest = 2; }

message GetStaffRequest { string hotel_key = 1; }
message GetStaffResponse { repeated StaffManagementProto staff = 1; }
message UpdateStaffRequest { string hotel_key = 1; StaffManagementProto staff = 2; }

message GetMenuRequest { string hotel_key = 1; }
message GetMenuResponse { repeated MenuItemManagementProto menu_items = 1; }
message UpdateMenuStockRequest {
  string hotel_key = 1;
  string item_id = 2;
  int32 stock_quantity = 3;
}

message GetTicketsRequest { string hotel_key = 1; }
message GetTicketsResponse { repeated TicketManagementProto tickets = 1; }
message UpdateTicketStatusRequest {
  string ticket_id = 1;
  string new_status = 2;
}
message DeleteStaffRequest {
  string staff_id = 1;
}

message CreateMenuRequest {
  string hotel_key = 1;
  string name = 2;
  double price = 3;
  int32 stock_quantity = 4;
}

message DeleteMenuRequest {
  string item_id = 1;
}

message CreateTicketRequest {
  string hotel_key = 1;
  string guest_name = 2;
  string room_number = 3;
  string ticket_type = 4;
  double total_price = 5;
  string status = 6;
}

message DeleteTicketRequest {
  string ticket_id = 1;
}