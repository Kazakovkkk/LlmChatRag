syntax = "proto3";

package llm;

option java_package = "com.example.grpc.llm";
option java_multiple_files = true;

service LlmService {
  // Стриминг ответа гостю (уже реализован у вас)
  rpc AnswerStream (AnswerStreamRequest) returns (stream AnswerStreamResponse);

  // НОВЫЙ МЕТОД: gRPC-аналог эндпоинта /llm/preprocess для классификации интентов
  rpc PreprocessQuestion (PreprocessGrpcRequest) returns (PreprocessGrpcResponse);
}

message MessageProto {
  string role = 1;
  string content = 2;
}

message AnswerStreamRequest {
  string question = 1;
  string context = 2;
  repeated MessageProto history = 3;
  string timestamp = 4;
}

message AnswerStreamResponse {
  string token = 1;
}

// --- НОВЫЕ СТРУКТУРЫ ДЛЯ КЛАССИФИКАЦИИ НАМЕРЕНИЙ И ПРЕПРОЦЕССИНГА ---

message PreprocessGrpcRequest {
  string question = 1;
  repeated MessageProto history = 2;
}

message PreprocessGrpcResponse {
  string intent_type = 1;             // "SEARCH" (дефолтный RAG) или "ACTION" (транзакционный агент)
  string action_name = 2;             // Имя экшена, если intent_type == "ACTION" (например, "ORDER_FOOD")
  map<string, string> parameters = 3; // Сущности, извлеченные из текста (например: {"dish": "пицца", "drink": "кола"})

  // Поля для ветки SEARCH (сохраняем обратную совместимость с вашим RAG-поиском)
  string normalized = 4;
  repeated string alternatives = 5;
}