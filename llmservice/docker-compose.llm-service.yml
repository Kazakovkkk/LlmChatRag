name: llm-service

services:
  llm-service:
    image: hotel-assistant/llm-service:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: llmservice

    restart: unless-stopped

    ports:
      - "8083:8083"
      - "9093:9093"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      SERVER_PORT: 8083
      SPRING_GRPC_SERVER_PORT: 9093
      JAVA_OPTS: ${LLM_SERVICE_JAVA_OPTS:--Xms256m -Xmx768m}

      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      LLM_PREPROCESS_PROVIDER: ${LLM_PREPROCESS_PROVIDER:-stub}

      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      LMSTUDIO_URL: ${LMSTUDIO_URL:-http://host.docker.internal:1234}

      GROQ_URL: ${GROQ_URL:-https://api.groq.com}
      GROQ_API_KEY: ${GROQ_API_KEY:-not-used}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}

      GEMINI_URL: ${GEMINI_URL:-https://generativelanguage.googleapis.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-not-used}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}

      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-not-used}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}