syntax = "proto3";

package rag;

option java_package = "com.example.grpc";
option java_multiple_files = true;

service RagService {
  rpc SearchSimilar (SearchRequest) returns (SearchResponse);
  rpc UploadDocument (UploadRequest) returns (UploadResponse);
  rpc SearchSimilarBatch(BatchSearchRequest) returns (SearchResponse);
  rpc GetChunks (GetChunksRequest) returns (GetChunksResponse);
  rpc UpdateChunk (UpdateChunkRequest) returns (UpdateChunkResponse);
}

message SearchRequest {
  string hotel_key = 1;
  string query = 2;
  int32 limit = 3;
}

message DocumentProto {
  string id = 1;
  string text = 2;
  double score = 3;
  map<string, string> metadata = 4;
}

message SearchResponse {
  repeated DocumentProto documents = 1;
}

message UploadRequest {
  string hotel_key = 1;
  bytes pdf_data = 2;
  string filename = 3;
  repeated string tags = 4;
  string mode = 5;
}

message UploadResponse {
  bool success = 1;
  string message = 2;
  string filename = 3;
  string tag = 4;
}
message BatchSearchRequest {
  string hotel_key = 1;
  repeated string queries = 2;
  int32 limit = 3;
}
message GetChunksRequest {
  string hotel_key = 1;
  int32 limit = 2;
  string offset_id = 3;
}

message GetChunksResponse {
  repeated DocumentProto chunks = 1;
  string next_offset_id = 2;
}

message UpdateChunkRequest {
  string hotel_key = 1;
  string chunk_id = 2;
  string new_text = 3;
}

message UpdateChunkResponse {
  bool success = 1;
  string message = 2;
}