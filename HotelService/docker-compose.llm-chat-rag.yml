name: llm-chat-rag

services:
  llm-chat-rag:
    image: hotel-assistant/llm-chat-rag:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: LlmChatRag

    restart: unless-stopped

    ports:
      - "8080:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      SERVER_PORT: 8080
      JAVA_OPTS: ${LLM_CHAT_JAVA_OPTS:--Xms256m -Xmx768m}

      QDRANT_SERVICE_URL: http://host.docker.internal:8085
      LLM_SERVICE_URL: http://host.docker.internal:8083
      ADMIN_SERVICE_URL: http://host.docker.internal:8087
      HOTEL_ACTION_SERVICE_URL: http://host.docker.internal:8089

      SPRING_GRPC_CLIENT_CHANNELS_RAG_SERVICE_ADDRESS: static://host.docker.internal:9090
      SPRING_GRPC_CLIENT_CHANNELS_RAG_SERVICE_NEGOTIATION_TYPE: plaintext

      SPRING_GRPC_CLIENT_CHANNELS_LLM_SERVICE_ADDRESS: static://host.docker.internal:9093
      SPRING_GRPC_CLIENT_CHANNELS_LLM_SERVICE_NEGOTIATION_TYPE: plaintext

      SPRING_GRPC_CLIENT_CHANNELS_HOTEL_ACTION_SERVICE_ADDRESS: static://host.docker.internal:9089
      SPRING_GRPC_CLIENT_CHANNELS_HOTEL_ACTION_SERVICE_NEGOTIATION_TYPE: plaintext

      DOCUMENT_UPLOAD_PROTOCOL: grpc
      SEARCH_PROTOCOL: grpc
      LLM_STREAM_PROTOCOL: grpc
      HOTEL_ACTION_PROTOCOL: grpc